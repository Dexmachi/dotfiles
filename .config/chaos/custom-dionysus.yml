users:
  - name: "dexmachina"
    shell: "zsh"
    sudo: True
    groups:
      - wheel
      - input
      - fido
      - tss
      - docker

secrets:
  sec_mode: sops
  templates:
  - from: ssh_priv.j2
    to: ".ssh/id_ed25519"
    owner: dexmachina
    mode: 0600
    escape: False
    vars:
      - ssh

  - from: ssh_pub.j2
    to: ".ssh/id_ed25519.pub"
    owner: dexmachina
    mode: 0600
    escape: False
    vars:
      - ssh

  - from: wg0_conf.j2
    to: "/etc/wireguard/wg0.conf"
    owner: root
    mode: 0600
    escape: False
    vars:
      - wg

  - from: wg1_conf.j2
    to: "/etc/wireguard/wg1.conf"
    owner: root
    mode: 0600
    escape: False
    vars:
      - wg

hostname: Dionysus
bootloader: grub
partitioning:
  disk: "/dev/sdb"
  partitions:
    - name: chronos
      important: boot
      size: 1GB
      mountpoint: "/boot"
      part: 1
      type: vfat

    - name: Moira
      important: swap
      size: 4GB
      part: 2
      type: linux-swap

    - name: dionysus_root
      important: root
      size: 46GB
      mountpoint: "/"
      part: 3
      type: ext4

    - name: dionysus_home
      important: home
      size: 100%
      mountpoint: "/home"
      part: 4
      type: ext4

repos:
  managed:
    core: true
    extras: true
    unstable: false

  third_party:
    - name: cachyos-core-v3
      include: /etc/pacman.d/cachyos-v3-mirrorlist
      distribution: "arch"

    - name: cachyos-extra-v3
      include: /etc/pacman.d/cachyos-v3-mirrorlist
      distribution: "arch"

    - name: cachyos-v3
      include: /etc/pacman.d/cachyos-v3-mirrorlist
      distribution: "arch"

    - name: cachyos
      include: /etc/pacman.d/cachyos-mirrorlist
      distribution: "arch"

dotfiles:
  - url: "https://github.com/Dexmachi/dotfiles.git"
    pull: false
    branch: "main"
    user: dexmachina
    links:
      - from: bookmarks
        to: .

      - from: .config
        to: .

      - from: bash
        to: .
        open: true

      - from: walls
        to: .
        open: true

      - from: zsh
        to: .
        open: true

      - from: ramble
        to: .local/share/chaos/ramble

      - from: Apollodorus
        to: Apollodorus

mirrors:
  countries:
    - "br"
    - "us"
  count: 25

services:
  - name: NetworkManager.service

  - name: NetworkManager-dispatcher.service
    on_boot: true
    running: false

  - name: bluetooth.service

  - name: sshd

  - name: nvidia-hibernate
    on_boot: true
    running: false

  - name: nvidia-persistenced.service
    on_boot: true
    running: false

  - name: nvidia-powerd.service
    on_boot: true
    running: false

  - name: nvidia-resume.service
    on_boot: true
    running: false

  - name: nvidia-suspend.service
    on_boot: true
    running: false

  - name: thinkfan.service
    on_boot: false

  - name: docker
    dense_service: true
    on_boot: false

  - name: containerd.service
    on_boot: false

  - name: sddm.service

  - name: proton
    dense_service: true

  - name: throttled
    dense_service: True
    on_boot: false

region:
  timezone: "America/Sao_Paulo"
  keymap: "br-abnt2"
  ntp: true
  locale:
    - pt_BR
    - en_US


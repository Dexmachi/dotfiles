pelago:
  - name: "k8s-test-hw"
    isle: "chaosmox"
    config:
      cluster_name: "k8s-dev"
      target_node: "lappis5"
      admin_user: "chaos"
      template_id: "9009"
      clone_full: true
      ssh_public_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHrUtVKtgovzDIQQBSz3ys77NPcqUTYG2IC7/2PJwyLb caiorocoli@gmail.com,232001371@aluno.unb.br
        - ~/.ssh/ssh-ed25519_chaos_imported_1788984576.1238034.pub

      etcd:
        count: 1
        cores: 2
        memory: 4096
        disks:
          - size: 40
            interface: "scsi0"
            datastore_id: "local-lvm"

      control_plane:
        count: 1
        cores: 2
        memory: 4096
        disks:
          - size: 40
            interface: "scsi0"
            datastore_id: "local-lvm"

      worker:
        count: 1
        cores: 4
        memory: 16384
        disks:
          - size: 100
            interface: "scsi0"
            datastore_id: "local-lvm"

          - size: 50
            interface: "scsi1"
            datastore_id: "local-lvm"

      storage:
        count: 0


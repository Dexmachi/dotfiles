# -----------------------------------------------------
# Window rules
# -----------------------------------------------------

windowrule = tile on, match:title Microsoft-edge
windowrule = tile on, match:title ^(Brave-browser)$
windowrule = tile on, match:title ^(Chromium)$
windowrule = float on, match:title ^(pavucontrol)$
windowrule = float on, match:title ^(blueman-manager)$
windowrule = float on, match:title ^(nm-connection-editor)$
windowrule = float on, match:title ^(qalculate-gtk)$

# Browser Picture in Picture
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = move (69.5%) (4%), match:title ^(Picture-in-Picture)$

windowrule = idle_inhibit always ,match:class ([window]) # Available modes: none, always, focus, fullscreen

layerrule = blur on, match:title waybar

# Pavucontrol floating
windowrule = float on,match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = size (700) (600),match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = center on,match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = pin on, match:class (.*org.pulseaudio.pavucontrol.*)

# Waypaper
windowrule = float on,match:class (.*waypaper.*)
windowrule = size (900) (700), match:class (.*waypaper.*)
windowrule = center on,match:class (.*waypaper.*)
windowrule = pin on, match:class (.*waypaper.*)

# SwayNC
layerrule = blur on, match:title swaync-control-center
layerrule = blur on, match:title swaync-notification-window
layerrule = ignore_alpha 0.5, match:title swaync-control-center
layerrule = ignore_alpha 0.5, match:title swaync-notification-window

# ML4W Calendar floating
windowrule = float on, match:class (calendario)
windowrule = move (100%-w-16) (66), match:class (calendario)
windowrule = pin on, match:class (calendario)
windowrule = size (60%) (70%), match:class (calendario)

windowrule = float on, match:initial_title (calendario)
windowrule = move (100%-w-16) (66), match:initial_title (calendario)
windowrule = pin on, match:initial_title (calendario)
windowrule = size (60%) (70%), match:initial_title (calendario)

# ML4W Sidebar floating
windowrule = float on, match:class (com.ml4w.sidebar)
windowrule = move (100%-w-16) (66),match:class (com.ml4w.sidebar)
windowrule = pin on, match:class (com.ml4w.sidebar)
windowrule = size (400) (740), match:class (com.ml4w.sidebar)

# Blueman Manager
windowrule = float on, match:class (blueman-manager)
windowrule = size (800) (600), match:class (blueman-manager)
windowrule = center on, match:class (blueman-manager)

# nwg-look
windowrule = float on, match:class (nwg-look)
windowrule = size (700) (600), match:class (nwg-look)
windowrule = move (10%) (20%), match:class (nwg-look)
windowrule = pin on, match:class (nwg-look)

# nwg-displays
windowrule = float on, match:class (nwg-displays)
windowrule = size (900) (600), match:class (nwg-displays)
windowrule = move (10%) (20%), match:class (nwg-displays)
windowrule = pin on, match:class (nwg-displays)

# System Mission Center
windowrule = float on, match:class (io.missioncenter.MissionCenter)
windowrule = pin on, match:class (io.missioncenter.MissionCenter)
windowrule = center on, match:class (io.missioncenter.MissionCenter)
windowrule = size (900) (600), match:class (io.missioncenter.MissionCenter)

# System Mission Center Preference Window
windowrule = float on, match:class (missioncenter), match:title ^(Preferences)$
windowrule = pin on, match:class (missioncenter), match:title ^(Preferences)$
windowrule = center on, match:class (missioncenter), match:title ^(Preferences)$

# Gnome Calculator
windowrule = float on, match:class (org.gnome.Calculator)
windowrule = size (700) (600), match:class (org.gnome.Calculator)
windowrule = center on, match:class (org.gnome.Calculator)

# General floating
windowrule = float on, match:class (dotfiles-floating)
windowrule = size (1000) (700), match:class (dotfiles-floating)
windowrule = center on, match:class (dotfiles-floating)

# Floating for Ghostty
windowrule = float on, match:class (ml4w.dotfiles.floating)
windowrule = size (1000) (700), match:class (ml4w.dotfiles.floating)
windowrule = center on, match:class (ml4w.dotfiles.floating)
windowrule = pin on, match:class (ml4w.dotfiles.floating)

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Dotfiles Sidepad
windowrule = float on, match:class (dotfiles-sidepad)
windowrule = size (85%) (70%), match:class (dotfiles-sidepad)
windowrule = center on, match:class (dotfiles-sidepad)
windowrule = pin on, match:class (dotfiles-sidepad)

windowrule = float on, match:initial_title (dotfiles-sidepad)
windowrule = size (85%) (70%), match:initial_title (dotfiles-sidepad)
windowrule = center on, match:initial_title (dotfiles-sidepad)
windowrule = pin on, match:initial_title (dotfiles-sidepad)

windowrule = float on, match:class org.gnome.Nautilus
windowrule = float on, size (60%) (50%), match:class org.telegram.desktop
windowrule = float on, size (60%) (50%), match:class org.gnome.TextEditor
windowrule = float on, size (65%) (50%), match:class org.kde.kdeconnect.app
windowrule = float on, size (70%) (60%), match:class localsend
windowrule = float on, size (60%) (50%), match:class vesktop
windowrule = float on, size (60%) (50%), match:class Spotify
windowrule = float on, size (60%) (50%), match:class heroic
windowrule = float on, size (60%) (50%), match:class modrinth-app
windowrule = float on, size (60%) (50%), match:class com.usebottles.bottles
windowrule = float on, size (60%) (50%), match:class com.rafaelmardojai.Blanket

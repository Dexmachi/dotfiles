title: init_schema
concept: gerador de Schema
what: um sistema pra criar schemas pro chobolo funcionais com sistemas de LSP
why: pra ter LSP até no próprio chobolo
how: talvez usando pydantic PRA ISSO EM ESPECÍFICO
scripts:
  python: |
    def infer_schema(data, key_name=None):
        # Tratamento especial para as strings de ajuda do Ch-aOS
        if key_name == "ATTENTION":
            return None 

        if isinstance(data, str):
            return {"type": "string"}
        elif isinstance(data, bool):
            return {"type": "boolean"}
        elif isinstance(data, int):
            return {"type": "integer"}

        elif isinstance(data, list):
            # Se for uma lista de dicts (como o fleet.py), infere o schema do primeiro
            if data and isinstance(data[0], (dict, list)):
                item_schema = infer_schema(data[0])
            else:
                item_schema = {"type": "string"}
            return {"type": "array", "items": item_schema}

        elif isinstance(data, dict):
            # Captura o comentário de ajuda se existir
            description = data.get("ATTENTION")

            properties = {}
            for k, v in data.items():
                s = infer_schema(v, k)
                if s: properties[k] = s

            schema = {"type": "object", "properties": properties}
            if description:
                schema["description"] = description.strip()

            return schema

        return {"type": "string"}

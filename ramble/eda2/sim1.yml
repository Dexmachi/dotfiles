title: sim1
concept: DFS
what: "básicamente: procura tudo de uma vez, coloca numa lista e dps compara tamanhos"
scripts:
  python: |

    def solve():
        inp = input().split()
        H = int(inp[0])
        W = int(inp[1])
        if not inp:
            return

        grid = []
        for _ in range(H):
            grid.append(list(input()))

        livres = 0
        start = None

        for r in range(H):
            for c in range(W):
                if grid[r][c] == '.':
                    livres+=1
                    if start == None:
                        start = (r,c)

        if livres == 0:
            print('sim')
            return

        visited = set()
        stack = [start]
        visited.add(start)
        count = 0
        dir = [(-1,0),(1,0),(0,-1),(0,1)]

        if stack:
            while stack:
                r,c = stack.pop()
                count+=1
                for dr, dc in dir:
                    nr,nc = r+dr, c+dc

                    if 0<=nr<H and 0<=nc<W:
                        if grid[nr][nc] == '.' and (nr,nc) not in visited:
                            visited.add((nr,nc))
                            stack.append((nr,nc))

            if count == livres:
                print('Sim')
                return
            print('Não')

    if __name__ == "__main__":
        solve()

